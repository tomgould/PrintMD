<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF Importer Layout Growth Test</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 960px; margin: 24px auto; padding: 0 16px; }
        table { border-collapse: collapse; width: 100%; }
        td { border-bottom: 1px solid #ddd; padding: 6px 8px; vertical-align: top; font-size: 0.85rem; white-space: pre-wrap; }
        tr.fail { background: #fff0f0; }
        td:last-child { font-family: monospace; color: #666; }
    </style>
</head>
<body>
<h1>PDF importer layout code on a crowded page: Tests</h1>
<p id="summary">Running…</p>
<table><tbody id="results"></tbody></table>
<div id="result" hidden></div>

<script type="module">
    // Rows, pieces, column channels and tables all meet every item of a page at
    // once, so one page of thousands of words must still import in linear time.
    import * as pdfImport from '../js/pdf-import.js';
    import * as growth from './lib/growth.js';
    import {createHarness, assert} from './lib/harness.js';

    const h = createHarness('IMPORTERS_PDF_GROWTH');

    /** One untagged page of n short words in a grid of `cols` columns (2pt type). */
    function gridPdf(n, cols = 40) {
        const rows = Math.ceil(n / cols);
        const step = 700 / rows;
        const parts = [];
        for (let i = 0; i < n; i++) {
            const x = 40 + (i % cols) * 13 + ((i * 7) % 5);
            const y = 760 - Math.floor(i / cols) * step;
            parts.push(`BT /F1 2 Tf ${x} ${y.toFixed(2)} Td (w${i % 97}) Tj ET`);
        }
        const stream = parts.join('\n');
        const objs = ['<< /Type /Catalog /Pages 2 0 R >>', '<< /Type /Pages /Kids [4 0 R] /Count 1 >>',
            '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',
            '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents 5 0 R /Resources << /Font << /F1 3 0 R >> >> >>',
            `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`];
        let out = '%PDF-1.4\n';
        const offs = [];
        objs.forEach((o, i) => { offs.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
        const xref = out.length;
        out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offs.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('');
        out += `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
        return new File([out], 'grid.pdf', {type: 'application/pdf'});
    }

    h.test('a page of thousands of scattered words imports in linear time', async () => {
        // 400 and 1,600 words, timed once: each import pays pdf.js's fixed cost, so more
        // runs only slow the page. A quadratic step would cost seconds at 1,600 words.
        const run = async (file) => {
            const out = await pdfImport.pdfToMarkdown(file);
            if (!/w1/.test(out)) throw new Error('not converted: ' + out.slice(0, 80));
        };
        const problem = await growth.checkLinear(run, gridPdf, {n: 400, runs: 1, capMs: 10000});
        assert(!problem, problem);
    });

    h.run();
</script>
</body>
</html>
