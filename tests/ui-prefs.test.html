<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UI preferences Tests</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 960px; margin: 24px auto; padding: 0 16px; }
        table { border-collapse: collapse; width: 100%; }
        td { border-bottom: 1px solid #ddd; padding: 6px 8px; vertical-align: top; font-size: 0.85rem; }
        tr.fail { background: #fff0f0; }
        td:last-child { font-family: monospace; color: #666; }
        iframe { width: 1400px; height: 900px; border: 0; }
    </style>
</head>
<body>
<h1>UI preferences: the divider, theme, view and sidebar survive a reload; garbage and blocked storage are harmless</h1>
<p id="summary">Running…</p>
<table><tbody id="results"></tbody></table>
<div id="result" hidden></div>
<iframe id="app" title="app under test"></iframe>
<script type="module">
    import * as store from '../js/store.js';
    import {createHarness, assert, resetStorage} from './lib/harness.js';

    const h = createHarness('UIPREFS');
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const frame = document.getElementById('app');
    const KEYS = {split: 'printmd-split', theme: 'printmd-theme', view: 'printmd-view', sidebar: 'printmd-sidebar-collapsed'};
    let win, doc;

    async function waitFor(fn, what, ms = 8000) {
        const end = Date.now() + ms;
        while (Date.now() < end) {
            try { if (fn()) return; } catch (_e) { /* not ready */ }
            await sleep(30);
        }
        throw new Error('timed out waiting for ' + what);
    }

    async function boot(reload = false) {
        const loaded = new Promise(res => frame.addEventListener('load', res, {once: true}));
        if (reload) frame.contentWindow.location.reload(); else frame.src = '../index.html';
        await loaded;
        win = frame.contentWindow;
        doc = frame.contentDocument;
        await waitFor(() => win.__bd && win.__bd.docManager.currentId != null && !$('editor').readOnly, 'app boot');
    }

    const $ = (id) => doc.getElementById(id);
    const setKeys = (values) => {
        for (const k of Object.values(KEYS)) localStorage.removeItem(k);
        for (const [k, v] of Object.entries(values)) localStorage.setItem(KEYS[k], v);
    };
    const key = (k, init = {}) => $('divider').dispatchEvent(new win.KeyboardEvent('keydown', {key: k, bubbles: true, cancelable: true, ...init}));
    const split = () => Number($('divider').getAttribute('aria-valuenow'));
    /** The editor's rendered share of the panes, in percent. */
    const editorShare = () => {
        const e = $('editor-pane').getBoundingClientRect().width;
        const p = $('preview-pane').getBoundingClientRect().width;
        return (e / (e + p)) * 100;
    };
    const view = () => ['split', 'editor', 'preview'].find((v) => $('main').classList.contains('view-' + v));
    const theme = () => doc.documentElement.getAttribute('data-theme');
    const collapsed = () => $('sidebar').classList.contains('collapsed');

    /** Drag the divider to a share of the panes (the window less the sidebar). */
    function drag(toPct) {
        const rect = $('main').getBoundingClientRect();
        const left = $('editor-pane').getBoundingClientRect().left;
        const x = left + ((rect.right - left) * toPct) / 100;
        const at = (type, target) => target.dispatchEvent(new win.MouseEvent(type, {bubbles: true, cancelable: true, clientX: x, clientY: rect.top + 50}));
        at('mousedown', $('divider'));
        at('mousemove', doc);
        at('mouseup', doc);
    }

    h.test('keyboard resize, theme, view and sidebar are all back after a reload', async () => {
        await resetStorage(store);
        setKeys({theme: 'light'});
        await boot();
        assert(split() === 50 && view() === 'split' && theme() === 'light' && !collapsed(), 'defaults first');
        key('Home');
        key('ArrowRight');
        assert(split() === 22, 'keyboard: ' + split());
        $('btn-theme').click();
        $('sidebar-toggle').click();
        doc.querySelector('#menu-view-list [data-view="preview"]').click();
        assert(theme() === 'dark' && collapsed() && view() === 'preview', 'changed before the reload');
        await boot(true);
        assert(split() === 22, 'divider after the reload: ' + split());
        assert(theme() === 'dark', 'theme after the reload: ' + theme());
        assert(collapsed(), 'sidebar after the reload');
        assert(view() === 'preview', 'view after the reload: ' + view());
    });

    h.test('a mouse drag of the divider is back after a reload, at the same share', async () => {
        doc.querySelector('#menu-view-list [data-view="split"]').click();
        drag(62);
        assert(Math.abs(split() - 62) <= 1, 'dragged to ' + split());
        const share = editorShare();
        await boot(true);
        assert(Math.abs(split() - 62) <= 1, 'divider after the reload: ' + split());
        assert(Math.abs(editorShare() - share) < 1, `editor share ${editorShare().toFixed(1)}%, before ${share.toFixed(1)}%`);
        assert(view() === 'split', 'view split');
        assert(Number(localStorage.getItem(KEYS.split)) === Math.round(Number(localStorage.getItem(KEYS.split)) * 10) / 10,
            'stored to one decimal: ' + localStorage.getItem(KEYS.split));
    });

    h.test('garbage in every key: the app boots on the defaults', async () => {
        // A few reloads only (each one boots the editor); the parser's other cases are in the same rule.
        for (const bad of ['abc', '50; width: 0', '1e2']) {
            setKeys({split: bad, theme: 'purple', view: 'grid', sidebar: 'yes'});
            await boot(true);
            assert(split() === 50 && $('editor-pane').style.width === '', `split ${JSON.stringify(bad)}: ${split()} ${$('editor-pane').style.width}`);
            if (bad !== 'abc') continue;   // the other keys once is enough
            assert(view() === 'split', 'view: ' + view());
            assert(theme() === 'light' || theme() === 'dark', 'theme: ' + theme());
            assert(!collapsed(), 'sidebar open');
        }
    });

    h.test('a stored position outside the limits is clamped, so neither pane can disappear', async () => {
        for (const [stored, want] of [['95', 80], ['0', 20]]) {
            setKeys({split: stored});
            await boot(true);
            assert(split() === want, `stored ${stored}: ${split()}, want ${want}`);
            const share = editorShare();
            assert(share >= 19 && share <= 81, `stored ${stored}: editor share ${share.toFixed(1)}%`);
            assert($('editor-pane').getBoundingClientRect().width > 100 && $('preview-pane').getBoundingClientRect().width > 100, 'both panes visible');
        }
        setKeys({});
    });

    async function cspOf(url) {
        const html = await (await fetch(url)).text();
        const meta = new DOMParser().parseFromString(html, 'text/html').querySelector('meta[http-equiv="Content-Security-Policy"]');
        return meta && meta.content;
    }

    h.test('blocked storage: the editor boots on the defaults and every preference still changes', async () => {
        assert(await cspOf('lib/blocked-storage-frame.html') === await cspOf('../index.html'), 'the frame has the app\'s policy');
        const r = await new Promise((resolve) => {
            const onMessage = (ev) => {
                if (ev.origin !== location.origin || !ev.data || ev.data.frame !== 'blocked-storage') return;
                window.removeEventListener('message', onMessage);
                resolve(ev.data);
            };
            window.addEventListener('message', onMessage);
            frame.src = 'lib/blocked-storage-frame.html';
        });
        assert(!r.error, 'booted: ' + r.error);
        assert(r.booted, 'a document loaded and the editor is editable');
        assert(r.errors.length === 0, 'no errors: ' + r.errors.join('; '));
        assert(r.split === '50' && r.editorWidth === '', 'divider default: ' + r.split + ' ' + r.editorWidth);
        assert(r.view === 'split' && !r.sidebarCollapsed, 'view and sidebar defaults');
        assert(r.theme === 'light' || r.theme === 'dark', 'theme: ' + r.theme);
        assert(r.splitAfterKey === '52', 'the divider still moves: ' + r.splitAfterKey);
        assert(r.themeAfterToggle !== r.theme && r.sidebarAfterToggle, 'theme and sidebar still toggle');
    });

    const frames = (n = 2) => new Promise((res) => { const step = (k) => (k ? win.requestAnimationFrame(() => step(k - 1)) : res()); step(n); });
    /** The pane's width inside its padding, the body page card, and its drawn and laid-out widths. */
    function fit() {
        const pane = $('preview-pane');
        const cs = win.getComputedStyle(pane);
        const inner = pane.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        const page = doc.querySelector('#preview .preview-page:not(.preview-page-cover)');
        const r = page.getBoundingClientRect();
        const p = pane.getBoundingClientRect();
        return {inner, page, drawn: r.width, laid: page.offsetWidth, left: r.left - p.left - parseFloat(cs.paddingLeft),
            paper: parseFloat(cs.getPropertyValue('--preview-page-width')), scale: Number($('preview').dataset.scale || 1)};
    }

    h.test('a remembered split with Preview only and the sidebar open: the pane fills the window and the pages scale to it', async () => {
        await resetStorage(store);
        setKeys({split: '40', view: 'preview'});
        localStorage.removeItem('printmd-preview-full');
        await boot();
        await waitFor(() => fit().scale > 1, 'the pages scaled');
        const main = $('main').getBoundingClientRect();
        const pane = $('preview-pane').getBoundingClientRect();
        const side = $('sidebar').getBoundingClientRect();
        assert(Math.abs(pane.right - main.right) < 1 && Math.abs(pane.left - side.right) < 2, `the pane fills the window: ${pane.left}..${pane.right}, sidebar ends ${side.right}, window ends ${main.right}`);
        const f = fit();
        assert(f.scale > 1, 'scaled: ' + f.scale);
        assert(Math.abs(f.laid - f.paper) < 1, `laid out at paper width, so the line breaks match the PDF: ${f.laid} for ${f.paper}`);
        assert(Math.abs(f.drawn - f.inner) < 2 && Math.abs(f.left) < 2, `drawn across the pane: ${f.drawn} of ${f.inner}, from ${f.left}`);
        const pv = $('preview-pane');
        assert(pv.scrollWidth <= pv.clientWidth + 1, 'no sideways scroll');
        assert(pv.scrollHeight >= $('preview').offsetHeight * f.scale - 2, `the scaled height scrolls: ${pv.scrollHeight}`);
    });

    h.test('the scale follows the sidebar, the editor, the orientation and the window, up to twice the size, then centred', async () => {
        await resetStorage(store);
        setKeys({view: 'preview'});
        localStorage.removeItem('printmd-preview-full');
        await boot();
        await waitFor(() => fit().scale > 1, 'the pages scaled');
        const open = fit().scale;
        $('sidebar-toggle').click();
        await waitFor(() => fit().scale > open + 0.05, 'a larger scale with the sidebar closed');
        assert(Math.abs(fit().drawn - fit().inner) < 2, 'fills the wider pane');
        $('sidebar-toggle').click();
        await waitFor(() => Math.abs(fit().scale - open) < 0.01, 'back with the sidebar open');
        // Split view: the pane is narrower than the paper, so the cards narrow as before.
        doc.querySelector('#menu-view-list [data-view="split"]').click();
        await waitFor(() => !$('preview').dataset.scale, 'no scale in the split view');
        assert(fit().drawn <= fit().inner + 1, 'the card fits the pane');
        doc.querySelector('#menu-view-list [data-view="preview"]').click();
        await waitFor(() => fit().scale > 1, 'scaled again');
        // Landscape: a wider page, a smaller scale, still the pane's width.
        const portrait = fit();
        const o = $('export-orientation');
        o.value = 'landscape';
        o.dispatchEvent(new win.Event('change', {bubbles: true}));
        await waitFor(() => fit().paper > portrait.paper, 'the landscape page');
        await frames();
        const land = fit();
        assert(land.scale < portrait.scale && Math.abs(land.laid - land.paper) < 1, `landscape: ${land.scale} at ${land.laid}`);
        assert(land.scale === 1 || Math.abs(land.drawn - land.inner) < 2, `landscape fills the pane: ${land.drawn} of ${land.inner}`);
        o.value = 'portrait';
        o.dispatchEvent(new win.Event('change', {bubbles: true}));
        // The window: a narrower frame, a smaller scale.
        await waitFor(() => Math.abs(fit().scale - portrait.scale) < 0.01, 'portrait again');
        frame.style.width = '1200px';
        try {
            await waitFor(() => fit().scale < portrait.scale - 0.05, 'a smaller scale in a narrower window');
            assert(Math.abs(fit().drawn - fit().inner) < 2, 'still the pane width');
        } finally {
            frame.style.width = '';
        }
        // A page under half the pane: twice its size, centred.
        $('preview-pane').style.setProperty('--preview-page-width', '400px');
        win.__bd.fitPreview();
        const small = fit();
        assert(small.scale === 2 && Math.abs(small.drawn - 800) < 1, 'capped at 2: ' + small.scale + ' ' + small.drawn);
        assert(Math.abs(small.left - (small.inner - small.drawn) / 2) < 2, `centred: ${small.left} of ${small.inner - small.drawn}`);
    });

    h.test('full width preview: the preview fills the window, its pages scale to it with their layout kept, and it is back after a reload', async () => {
        await resetStorage(store);
        setKeys({});
        localStorage.removeItem('printmd-preview-full');
        await boot();
        const item = $('menu-view-list').querySelector('[data-toggle="preview-full"]');
        assert(item && item.getAttribute('role') === 'menuitemcheckbox' && item.getAttribute('aria-checked') === 'false', 'off at first');
        const narrow = $('preview-pane').getBoundingClientRect().width;
        $('editor').focus();
        item.click();
        assert($('main').classList.contains('preview-full') && item.getAttribute('aria-checked') === 'true', 'on');
        for (const id of ['sidebar', 'editor-pane', 'divider']) assert(!$(id).getClientRects().length, id + ' hidden');
        const pane = $('preview-pane').getBoundingClientRect().width;
        assert(pane > narrow && Math.abs(pane - $('main').getBoundingClientRect().width) < 2, 'the preview fills the window: ' + pane);
        await waitFor(() => fit().scale > 1, 'the pages scaled to the window');
        const f = fit();
        assert(f.scale > 1 && Math.abs(f.laid - f.paper) < 1, `scaled, not reflowed: ${f.scale}, laid out ${f.laid} for ${f.paper}`);
        assert(Math.abs(f.drawn - f.inner) < 2, `the page is drawn across the window: ${f.drawn} of ${f.inner}`);
        assert(doc.activeElement === $('preview-pane'), 'focus moved off the hidden editor to the preview');
        assert(localStorage.getItem('printmd-preview-full') === '1', 'remembered');
        await boot(true);
        assert($('main').classList.contains('preview-full'), 'still on after a reload');
        $('menu-view-list').querySelector('[data-toggle="preview-full"]').click();
        assert(!$('main').classList.contains('preview-full') && $('editor-pane').getClientRects().length, 'off again');
        localStorage.removeItem('printmd-preview-full');
    });

    h.test('Close all asks once about browser-only text, then leaves one blank document', async () => {
        await resetStorage(store);
        setKeys({});
        await boot();
        await win.__bd.docManager.newDoc('# Second');
        await win.__bd.renderSidebar();
        const asked = [];
        win.confirm = (m) => { asked.push(m); return false; };
        await win.__bd.closeAllDocuments();
        assert(asked.length === 1 && /^Close all 2 documents\? 2 of them have changes that are only in this browser/.test(asked[0]), 'asked: ' + asked[0]);
        assert((await win.__bd.docManager.currentId) && $('editor').value === '# Second', 'No keeps everything');
        win.confirm = (m) => { asked.push(m); return true; };
        await win.__bd.closeAllDocuments();
        await waitFor(() => doc.querySelectorAll('#doc-list .doc-item').length <= 1, 'list emptied');
        assert($('editor').value === '', 'a blank document is open');
        const left = await win.__bd.docManager.currentId;
        assert(left, 'one doc open');
    });

    h.run();
</script>
</body>
</html>
